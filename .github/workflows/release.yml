name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: read
  issues: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'ci skip') && !contains(github.event.head_commit.message, 'skip ci')"
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install pnpm
        run: npm install -g pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check version
        id: version
        run: |
          echo "--- auto version raw output ---"
          pnpm exec auto version 2>&1 | tee /tmp/auto-output.txt || true
          echo "--- end raw output ---"
          VERSION=$(tail -1 /tmp/auto-output.txt)
          echo "Parsed VERSION=$VERSION"
          if [[ "$VERSION" == "patch" || "$VERSION" == "minor" || "$VERSION" == "major" ]]; then
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "No valid version bump detected, skipping release"
            echo "version=" >> "$GITHUB_OUTPUT"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    needs: gate
    if: needs.gate.outputs.version != ''
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install pnpm
        run: npm install -g pnpm

      - run: pnpm install --frozen-lockfile

      - name: Determine new version
        id: tag
        run: |
          BUMP="${{ needs.gate.outputs.version }}"
          CURRENT=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          CURRENT="${CURRENT#v}"
          IFS='.' read -r major minor patch <<< "$CURRENT"
          case "$BUMP" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          NEW="v${major}.${minor}.${patch}"
          echo "tag=$NEW" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create tag
        run: |
          git tag ${{ steps.tag.outputs.tag }}
          git push origin ${{ steps.tag.outputs.tag }}

      - name: Create draft release
        run: |
          gh release create ${{ steps.tag.outputs.tag }} \
            --draft \
            --title "${{ steps.tag.outputs.tag }}" \
            --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: release
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux-x86_64
            bundles: deb,appimage
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x86_64
            bundles: nsis
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macos-aarch64
            bundles: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/azure-cli.list
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Import Apple certificate
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo -n "$APPLE_CERTIFICATE" | base64 --decode -o $CERT_PATH
          security create-keychain -p "" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "" $KEYCHAIN_PATH
          security import $CERT_PATH -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

      - name: Inject version
        shell: bash
        run: |
          VERSION="${{ needs.release.outputs.tag }}"
          VERSION="${VERSION#v}"
          sed -i.bak "s/\"version\": \"0\.0\.0\"/\"version\": \"$VERSION\"/g" package.json
          sed -i.bak "s/\"version\": \"0\.0\.0\"/\"version\": \"$VERSION\"/g" src-tauri/tauri.conf.json
          sed -i.bak "s/^version = \"0\.0\.0\"/version = \"$VERSION\"/" src-tauri/Cargo.toml
          sed -i.bak "/^name = \"planeai\"/{n;s/^version = \"0\.0\.0\"/version = \"$VERSION\"/;}" src-tauri/Cargo.lock

      - run: pnpm install --frozen-lockfile

      - name: Build Tauri
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          JIRA_CLIENT_ID: ${{ secrets.JIRA_CLIENT_ID }}
          JIRA_CLIENT_SECRET: ${{ secrets.JIRA_CLIENT_SECRET }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Bundle sidecar binaries into app
        shell: bash
        run: |
          EXT=""
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            EXT=".exe"
          fi
          CLI_BIN="src-tauri/target/${{ matrix.target }}/release/planeai-cli${EXT}"
          DAEMON_BIN="src-tauri/target/${{ matrix.target }}/release/planeai-daemon${EXT}"

          if [[ "${{ runner.os }}" == "macOS" ]]; then
            APP_DIR=$(find src-tauri/target/${{ matrix.target }}/release/bundle -name "*.app" -type d | head -1)
            if [[ -n "$APP_DIR" ]]; then
              cp "$CLI_BIN" "$APP_DIR/Contents/MacOS/planeai-cli"
              cp "$DAEMON_BIN" "$APP_DIR/Contents/MacOS/planeai-daemon"
              # Re-create the DMG with the updated .app
              DMG_PATH=$(find src-tauri/target/${{ matrix.target }}/release/bundle -name "*.dmg" | head -1)
              if [[ -n "$DMG_PATH" ]]; then
                rm -f "$DMG_PATH"
                hdiutil create -volname "planeai" -srcfolder "$APP_DIR" -ov -format UDZO "$DMG_PATH"
              fi
            fi
          fi

          if [[ "${{ runner.os }}" == "Windows" ]]; then
            # NSIS installer bundles everything from the release dir that Tauri includes,
            # but sidecar binaries need to be next to the main exe in the bundle output.
            NSIS_DIR=$(find src-tauri/target/${{ matrix.target }}/release/bundle/nsis -type d | head -1)
            if [[ -n "$NSIS_DIR" ]]; then
              cp "$DAEMON_BIN" "$NSIS_DIR/planeai-daemon.exe"
              cp "$CLI_BIN" "$NSIS_DIR/planeai-cli.exe"
            fi
          fi

          if [[ "${{ runner.os }}" == "Linux" ]]; then
            # For .deb, binaries go in /usr/bin alongside the main binary
            DEB_BIN_DIR=$(find src-tauri/target/${{ matrix.target }}/release/bundle/deb -path "*/usr/bin" -type d | head -1)
            if [[ -n "$DEB_BIN_DIR" ]]; then
              cp "$CLI_BIN" "$DEB_BIN_DIR/planeai-cli"
              cp "$DAEMON_BIN" "$DEB_BIN_DIR/planeai-daemon"
            fi
            # For AppImage, copy next to main binary
            APPIMAGE_BIN=$(find src-tauri/target/${{ matrix.target }}/release/bundle/appimage -name "planeai" -type f | head -1)
            if [[ -n "$APPIMAGE_BIN" ]]; then
              APPIMAGE_DIR=$(dirname "$APPIMAGE_BIN")
              cp "$CLI_BIN" "$APPIMAGE_DIR/planeai-cli"
              cp "$DAEMON_BIN" "$APPIMAGE_DIR/planeai-daemon"
            fi
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.label }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.tar.gz
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.tar.gz.sig
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.zip
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.zip.sig

  publish:
    needs: [release, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Upload assets to release
        run: |
          find artifacts -type f \( -name "*.dmg" -o -name "*.exe" -o -name "*.deb" -o -name "*.AppImage" -o -name "*.tar.gz" -o -name "*.nsis.zip" \) \
            -exec gh release upload ${{ needs.release.outputs.tag }} {} \;
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      - name: Generate latest.json for updater
        run: |
          TAG="${{ needs.release.outputs.tag }}"
          VERSION="${TAG#v}"
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # Find signature files in artifacts
          DARWIN_SIG=$(find artifacts -name "*.app.tar.gz.sig" | head -1)
          LINUX_SIG=$(find artifacts -name "*.AppImage.tar.gz.sig" | head -1)
          WINDOWS_SIG=$(find artifacts -name "*.nsis.zip.sig" | head -1)

          # Find updater bundles
          DARWIN_BUNDLE=$(find artifacts -name "*.app.tar.gz" ! -name "*.sig" | head -1)
          LINUX_BUNDLE=$(find artifacts -name "*.AppImage.tar.gz" ! -name "*.sig" | head -1)
          WINDOWS_BUNDLE=$(find artifacts -name "*.nsis.zip" ! -name "*.sig" | head -1)

          # Build JSON with jq — only include platforms that have both sig and bundle
          BASE_URL="https://github.com/nicolegros/planeai/releases/download/$TAG"
          JSON=$(jq -n --arg version "$VERSION" --arg pub_date "$PUB_DATE" \
            '{version: $version, notes: "", pub_date: $pub_date, platforms: {}}')

          if [ -f "$DARWIN_SIG" ] && [ -f "$DARWIN_BUNDLE" ]; then
            SIG_CONTENT=$(cat "$DARWIN_SIG")
            FILENAME=$(basename "$DARWIN_BUNDLE")
            JSON=$(echo "$JSON" | jq --arg sig "$SIG_CONTENT" --arg url "$BASE_URL/$FILENAME" \
              '.platforms["darwin-aarch64"] = {signature: $sig, url: $url}')
          fi

          if [ -f "$LINUX_SIG" ] && [ -f "$LINUX_BUNDLE" ]; then
            SIG_CONTENT=$(cat "$LINUX_SIG")
            FILENAME=$(basename "$LINUX_BUNDLE")
            JSON=$(echo "$JSON" | jq --arg sig "$SIG_CONTENT" --arg url "$BASE_URL/$FILENAME" \
              '.platforms["linux-x86_64"] = {signature: $sig, url: $url}')
          fi

          if [ -f "$WINDOWS_SIG" ] && [ -f "$WINDOWS_BUNDLE" ]; then
            SIG_CONTENT=$(cat "$WINDOWS_SIG")
            FILENAME=$(basename "$WINDOWS_BUNDLE")
            JSON=$(echo "$JSON" | jq --arg sig "$SIG_CONTENT" --arg url "$BASE_URL/$FILENAME" \
              '.platforms["windows-x86_64"] = {signature: $sig, url: $url}')
          fi

          echo "$JSON" > latest.json

          # Validate at least one platform was found
          PLATFORM_COUNT=$(echo "$JSON" | jq '.platforms | length')
          if [ "$PLATFORM_COUNT" -eq 0 ]; then
            echo "ERROR: No updater artifacts found — latest.json would have empty platforms"
            exit 1
          fi
          echo "latest.json contains $PLATFORM_COUNT platform(s)"

          gh release upload "$TAG" latest.json --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      - name: Publish release
        run: gh release edit ${{ needs.release.outputs.tag }} --draft=false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
