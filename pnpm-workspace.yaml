minimumReleaseAge: 10080

onlyBuiltDependencies:
  - esbuild
  - "@tailwindcss/oxide"

overrides:
  brace-expansion: ">=5.0.11"
  devalue: ">=5.9.2 <6"
  handlebars: ">=4.7.10 <5"
  nanoid: 3.3.18
  postcss: ">=8.5.18"
  source-map-js: ">=1.2.2 <2"
  undici: ">=8.10.2"

auditConfig:
  ignoreGhsas:
    # braces has no patched release. It is only reached through auto's fast-glob
    # in the release workflow, which expands trusted globs from this repo.
    # Remove once braces ships a fix or auto drops fast-glob.
    - GHSA-vfj7-8cjw-p6xm
    # markdown-it 15.0.3 fixes it but it and its argparse 3.0.3 are still inside
    # minimumReleaseAge. Bump markdown-it and remove this after 2026-10-23.
    - GHSA-gfr2-rv44-r23c
