schema: planeai.loop.recipe.v1
id: maker-verifier
name: Maker + Verifier
description: >
  Full maker-verifier loop. Maker implements, gates verify automatically,
  a verifier agent reviews, and rounds cycle on rejection until max_rounds.

trigger:
  kind: manual

inputs:
  goal:
    type: textarea
    label: Goal
    description: What should the maker implement?
    required: true
  task_key:
    type: task
    label: Linked task
    required: false
  gate_command:
    type: text
    label: Gate command
    description: Command to verify the implementation
    required: false
    default: make ci

knowledge:
  files:
    - AGENTS.md
    - CONTEXT.md
  instructions:
    - Follow repository conventions.
    - Prefer existing PlaneAI services and domain types.
    - Record progress through structured handoffs, not terminal claims.

tools:
  required:
    - git
    - plane_sessions
    - plane_loops
  optional:
    - github
    - jira
    - mcp

roles:
  maker:
    provider: default
    mode: write
    isolation: worktree
    instructions: |
      You are the maker agent.
      Implement the requested change in your isolated worktree.
      Do not claim completion unless you have recorded a structured handoff.

  verifier:
    provider: default
    mode: review
    isolation: readonly
    instructions: |
      You are the verifier agent.
      Review the maker's changes. Do not edit files.
      If the changes satisfy the goal and pass your review, record a handoff with status: completed.
      If the changes need work, record a handoff with status: needs_human and describe what must change.

policy:
  max_rounds: 3
  max_ticks: 50
  max_sessions: 5
  stale_after_ms: 600000
  merge_policy: human

steps:
  # ─── Round start: create maker session ───────────────────────────────────────
  - id: create_maker
    kind: session.create
    role: maker
    prompt: |
      You are running inside a PlaneAI loop.

      Loop:
      {{ loop_run.id }}

      Goal:
      {{ inputs.goal }}

      {% if inputs.task_key %}
      Task:
      {{ inputs.task_key }}
      {% endif %}

      Round: {{ runtime.round }}

      {% if runtime.last_error %}
      Previous round feedback:
      {{ runtime.last_error }}
      {% endif %}

      Project knowledge:
      {{ knowledge.files }}

      Instructions:
      - Work only in your assigned workspace.
      - Make the smallest safe change that satisfies the goal.
      - Run relevant checks if possible.
      - When done, write and record a planeai.handoff.v1 handoff.
      - Your handoff status must be one of: completed, blocked, needs_human, failed.

      Handoff protocol:
      1. Your session id is available as:
         $PLANEAI_SESSION_ID

      2. Get your expected handoff path:
         planeai-cli axi loop handoff path \
           --loop {{ loop_run.id }} \
           --session "$PLANEAI_SESSION_ID"

      3. Write a JSON file with schema planeai.handoff.v1.

      4. Record it:
         planeai-cli axi loop handoff record \
           --loop {{ loop_run.id }} \
           --session "$PLANEAI_SESSION_ID" \
           --path <handoff-path>

      5. After recording the handoff, stop and wait. Do not keep changing files unless prompted again.

  # ─── Wait for maker to hand off ─────────────────────────────────────────────
  - id: wait_for_maker
    kind: handoff.wait
    from: maker
    on:
      completed: run_gates
      blocked: blocked
      needs_human: needs_human
      failed: failed

  # ─── Run verification gates (tests, lint, typecheck) ─────────────────────────
  - id: run_gates
    kind: gates.run
    role: maker
    gates:
      - name: ci
        command: "{{ inputs.gate_command | default('make ci') }}"
    on:
      pass: create_verifier
      fail: gates_failed_retry
      error: gates_failed_retry

  # ─── Gates failed: prompt maker with feedback and retry ──────────────────────
  - id: gates_failed_retry
    kind: session.prompt
    role: maker
    select: latest
    prompt: |
      Round {{ runtime.round }} — verification gates failed.

      {% if runtime.last_error %}
      Failure details:
      {{ runtime.last_error }}
      {% endif %}

      Review the gate output and fix the issues. Then record a new handoff.
      Do NOT skip tests or suppress errors. Fix the root cause.
    next: increment_round_after_gates

  - id: increment_round_after_gates
    kind: round.next
    next: wait_for_maker

  # ─── Gates passed: create verifier session ───────────────────────────────────
  - id: create_verifier
    kind: session.create
    role: verifier
    prompt: |
      You are the verifier agent in a PlaneAI maker-verifier loop.

      Loop: {{ loop_run.id }}
      Goal: {{ inputs.goal }}
      Round: {{ runtime.round }}

      The maker has completed their implementation and gates have passed.

      Your job:
      1. Review the diff and changed files.
      2. Check that the implementation satisfies the stated goal.
      3. Look for correctness issues, edge cases, and missing tests.
      4. Do NOT make changes yourself.

      When done, record a planeai.handoff.v1 handoff:
      - status: completed — if the changes are good and ready for human review.
      - status: needs_human — if the changes need work. Describe what must change in the summary.

      Handoff protocol:
      1. Your session id is available as:
         $PLANEAI_SESSION_ID

      2. Get your expected handoff path:
         planeai-cli axi loop handoff path \
           --loop {{ loop_run.id }} \
           --session "$PLANEAI_SESSION_ID"

      3. Write a JSON file with schema planeai.handoff.v1.

      4. Record it:
         planeai-cli axi loop handoff record \
           --loop {{ loop_run.id }} \
           --session "$PLANEAI_SESSION_ID" \
           --path <handoff-path>

  # ─── Wait for verifier to hand off ──────────────────────────────────────────
  - id: wait_for_verifier
    kind: handoff.wait
    from: verifier
    on:
      completed: completed_unreviewed
      needs_human: verifier_rejected_retry
      blocked: blocked
      failed: failed

  # ─── Verifier rejected: send feedback to maker and retry ─────────────────────
  - id: verifier_rejected_retry
    kind: session.prompt
    role: maker
    select: latest
    prompt: |
      Round {{ runtime.round }} — the verifier has requested changes.

      Verifier feedback:
      {{ runtime.last_error }}

      Address the issues raised above, then record a new handoff.
      Focus on the specific concerns raised. Do not introduce unrelated changes.
    next: increment_round_after_review

  - id: increment_round_after_review
    kind: round.next
    next: wait_for_maker

  # ─── Terminal states ─────────────────────────────────────────────────────────
  - id: completed_unreviewed
    kind: loop.status
    status: completed_unreviewed

  - id: blocked
    kind: loop.status
    status: blocked

  - id: needs_human
    kind: loop.status
    status: needs_human

  - id: failed
    kind: loop.status
    status: failed
