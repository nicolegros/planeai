[workspace]
members = ["planeai-core", "planeai-tasks", "planeai-daemon", "planeai-ipc", "planeai-iced-spike", "planeai-pty"]
resolver = "2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
tokio = { version = "1", features = [
  "macros",
  "process",
  "rt-multi-thread",
  "time",
  "io-util",
  "net",
] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
tempfile = "3"

[package]
name = "planeai"
version = "0.0.0"
edition = "2021"

[lib]
name = "planeai"
path = "src/lib.rs"

[[bin]]
name = "planeai"
path = "src/main.rs"

[[bin]]
name = "planeai-cli"
path = "src/bin/cli.rs"

[[bin]]
name = "planeai-daemon"
path = "src/bin/daemon.rs"

[dependencies]
planeai-core = { path = "planeai-core" }
planeai-tasks = { path = "planeai-tasks" }
planeai-ipc = { path = "planeai-ipc", features = ["async"] }
planeai-daemon = { path = "planeai-daemon" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tauri = { version = "2.5", features = ["macos-private-api", "devtools"] }
serde = { workspace = true }
serde_json = { workspace = true }
json_comments = "0.2"
regex = { workspace = true }
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
portable-pty = "0.8"
tauri-plugin-opener = "2.5.4"
font-kit = "0.14"
trash = "5"
notify = "7"
tokio-util = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[build-dependencies]
tauri-build = { version = "2.0", features = [] }
