[package]
name = "planeai-symphony"
version = "0.0.0"
edition = "2021"

[[bin]]
name = "planeai-symphony"
path = "src/main.rs"

[dependencies]
planeai-core = { path = "../planeai-core" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
json_comments = "0.2"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = "0.4"
