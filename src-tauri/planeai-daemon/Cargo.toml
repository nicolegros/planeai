[package]
name = "planeai-daemon"
version = "0.1.0"
edition = "2021"

[lib]
name = "planeai_daemon"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
planeai-ipc = { path = "../planeai-ipc", features = ["async"] }
portable-pty = "0.8"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync", "signal", "io-util", "net"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = [
  "rt-multi-thread",
  "macros",
  "time",
  "sync",
  "io-util",
  "net",
] }
tempfile = { workspace = true }
serde_json = { workspace = true }
