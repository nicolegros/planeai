[package]
name = "planeai-rmux-spike"
version = "0.0.0"
edition = "2021"
publish = false

# Throwaway spike for ADR-0012. Not part of the shipped app: it exists only to
# answer the rmux go/no-go probes before any production wiring.

[[bin]]
name = "planeai-rmux-spike"
path = "src/main.rs"

[dependencies]
rmux-sdk = "=0.10.0"
clap = { version = "4", features = ["derive"] }
tokio = { workspace = true }
