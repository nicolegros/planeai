[package]
name = "planeai-plugin-jira"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "planeai-plugin-jira"
path = "src/main.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
reqwest = { version = "0.13", features = ["json"] }
rand = "0.10"
base64 = "0.23"
url = "2"
sha2 = "0.11"
thiserror = "2"

[dev-dependencies]
wiremock = "0.6"
