[package]
name = "planeai-plugin-jira"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "planeai-plugin-jira"
path = "src/main.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
reqwest = { version = "=0.13.4", features = ["json"] }
rand = "=0.10.2"
base64 = "=0.23.1"
url = "=2.5.8"
