[package]
name = "planeai-iced-spike"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "planeai-iced-spike"
path = "src/main.rs"

[dependencies]
alacritty_terminal = "0.26"
anyhow = "1"
iced = { version = "0.14", features = ["canvas", "tokio"] }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
libc = "0.2"
portable-pty = "0.8"
smol_str = "0.2"
arboard = "3"
