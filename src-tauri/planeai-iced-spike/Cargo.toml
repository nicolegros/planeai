[package]
name = "planeai-iced-spike"
version = "0.1.0"
edition = "2021"

[lib]
name = "planeai_iced_spike"
path = "src/lib.rs"

[[bin]]
name = "planeai-iced"
path = "src/main.rs"

[[bin]]
name = "daemon-lifecycle-smoke"
path = "src/bin/daemon_lifecycle_smoke.rs"

[[bin]]
name = "planeai-workflow-smoke"
path = "src/bin/workflow_smoke.rs"

[[bin]]
name = "planeai-domain-smoke"
path = "src/bin/domain_smoke.rs"

[[bin]]
name = "planeai-worktree-smoke"
path = "src/bin/worktree_smoke.rs"

[[bin]]
name = "planeai-task-smoke"
path = "src/bin/task_smoke.rs"

[dependencies]
alacritty_terminal = "0.26"
anyhow = "1"
dark-light = "2"
iced = { version = "0.14", features = ["canvas", "tokio", "svg"] }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
libc = "0.2"
portable-pty = "0.8"
smol_str = "0.2"
arboard = "3"
planeai-pty = { path = "../planeai-pty" }
font-kit = "0.14"
planeai-core = { path = "../planeai-core" }
planeai-tasks = { path = "../planeai-tasks" }
rusqlite = { version = "0.31", features = ["bundled"] }
planeai-daemon = { path = "../planeai-daemon" }
planeai-ipc = { path = "../planeai-ipc", features = ["async"] }
tokio = { workspace = true }
tokio-stream = "0.1"
notify-rust = "4"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
uuid = { version = "1", features = ["v4"] }
tempfile = { workspace = true }
